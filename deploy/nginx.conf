# nginx как обратный прокси перед server/server.py (он раздаёт страницы и принимает ответы)
server {
    listen 80;
    server_name physlab.example.kz;          # замените на свой домен
    client_max_body_size 256k;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
